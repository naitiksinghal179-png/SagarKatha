<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1824">
<title>SagarKatha — सागरकथा</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1824;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--tx:#EAF2F6;--tx2:rgba(234,242,246,.7);--tx3:rgba(234,242,246,.45);--wave:#2A9D8F;--sky:#7DD3FC;--gold:#F4D58D;--coral:#FCA5A5;--green:#6FCF97;--serif:'Cormorant Garamond','Noto Serif',Georgia,serif;--sans:'Noto Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--fs:16px;--navh:64px;--toph:58px}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.large{--fs:19px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky)}
h1,h2,h3{font-family:var(--serif);line-height:1.15}
.top{position:sticky;top:0;z-index:50;height:var(--toph);display:flex;align-items:center;gap:.5rem;padding:0 1rem;background:rgba(11,24,36,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-weight:700;font-size:1.6rem;flex:1;cursor:pointer}
.logo i{color:var(--sky)}
.ibtn{min-height:44px;min-width:44px;padding:0 .8rem;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-size:.9rem;cursor:pointer}
.ibtn:hover{border-color:var(--wave)}
.pill{font-family:var(--mono);font-size:.68rem;padding:.2rem .6rem;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.on{color:var(--green);border-color:rgba(111,207,151,.4)}
.pill.off{color:var(--coral);border-color:rgba(252,165,165,.4)}
main{padding:1rem 1rem calc(var(--navh) + 6rem);max-width:1100px;margin:0 auto}
#nav{position:fixed;z-index:60;bottom:0;left:0;right:0;height:var(--navh);display:flex;background:rgba(11,24,36,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.58rem;color:var(--tx3);padding:0 1px}
#nav button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav .i{font-size:1.2rem;line-height:1}
#nav button.on{color:var(--sky)}
#nav button.rec .i{background:linear-gradient(135deg,var(--wave),#1A5F7A);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 16px rgba(42,157,143,.5)}
@media(min-width:900px){
#nav{top:var(--toph);bottom:0;right:auto;width:92px;height:auto;flex-direction:column;justify-content:flex-start;gap:.3rem;padding:1rem .3rem;border-top:0;border-right:1px solid var(--line)}
#nav button{flex:none;height:64px;border-radius:12px;font-size:.72rem}
#nav button.rec .i{margin-top:0}
body{padding-left:92px}
.top{margin-left:-92px;padding-left:calc(92px + 1rem)}
main{padding-bottom:5rem}
#chatFab{bottom:20px!important}
}
.page{display:none}
.page.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.pt{font-size:2.1rem;margin:.4rem 0 .3rem}
h3.sx{font-size:1.5rem;margin:1.5rem 0 .6rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sub{color:var(--tx2);margin-bottom:1rem;max-width:62ch}
.meta{font-family:var(--mono);font-size:.68rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{min-height:48px;padding:0 1.2rem;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;text-align:center}
.btn.p{background:linear-gradient(135deg,var(--wave),#1A5F7A);color:#fff}
.btn.g{border:1px solid var(--line);background:var(--card)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.2rem 0 .6rem}
.chip{min-height:38px;padding:0 .9rem;border-radius:99px;border:1px solid var(--line);font-size:.82rem;background:var(--card);display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.chip.on{background:rgba(42,157,143,.28);border-color:var(--wave);color:#fff}
.tag{display:inline-block;font-family:var(--mono);font-size:.65rem;padding:.1rem .55rem;border-radius:99px;margin:0 .25rem .25rem 0;background:rgba(255,255,255,.08)}
.tag.cat{border:1px solid var(--c);color:var(--c);background:transparent}
.hero{padding:2rem 1.2rem;border-radius:20px;background:radial-gradient(ellipse at 15% 0%,rgba(42,157,143,.28),transparent 60%),linear-gradient(160deg,#0E2338,#102840);border:1px solid var(--line)}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:.4rem 0 .6rem;background:linear-gradient(135deg,#fff,#7DD3FC 60%,#2A9D8F);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0}
.stat{text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:2.2rem;color:var(--sky);line-height:1}
.stat small{color:var(--tx3);font-size:.75rem}
label.l{display:block;font-size:.82rem;color:var(--tx2);margin:1rem 0 .35rem;font-weight:700}
.inp,.sel,.ta{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;min-height:48px}
.ta{min-height:120px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--wave);outline-offset:1px}
.sel option{background:#102840}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{flex:1;min-width:92px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.85rem;padding:.3rem .5rem}
.seg button.on{border-color:var(--wave);background:rgba(42,157,143,.24)}
.mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--wave),#1A5F7A);font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:.3rem auto .5rem}
.mic.rec{background:linear-gradient(135deg,#B84040,#7f1d1d);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,64,64,.6)}70%{box-shadow:0 0 0 26px rgba(184,64,64,0)}100%{box-shadow:0 0 0 0 rgba(184,64,64,0)}}
.pv{display:flex;align-items:center;gap:.5rem;margin:.6rem 0;flex-wrap:wrap}
.pv img{max-height:110px;border-radius:10px}
.th{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:.4rem;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem;margin:.6rem 0}
.gal img{width:100%;border-radius:10px;cursor:zoom-in}
#leaflet{height:min(62vh,560px);min-height:380px;border-radius:16px;border:1px solid var(--line);background:#0a1d2f}
.leaflet-container{background:#0a1d2f;font-family:var(--sans)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #0B1824;box-shadow:0 0 0 2px var(--c),0 2px 8px rgba(0,0,0,.5);position:relative}
.pin.tale{border-radius:5px;transform:rotate(45deg)}
.pin.new::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ping 1.6s ease-out 3}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
.flow svg{width:30px;height:30px;fill:var(--sky);filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.sealbl{color:rgba(125,211,252,.42);font:italic 600 .85rem var(--serif);letter-spacing:.35em;text-transform:uppercase;white-space:nowrap;text-align:center;pointer-events:none}
.rglbl{color:rgba(234,242,246,.55);font:500 .62rem var(--mono);white-space:nowrap;pointer-events:none;text-shadow:0 0 4px #000}
.leaflet-tooltip{background:#0E2338;color:var(--tx);border:1px solid var(--line)}
.sc{cursor:pointer;transition:transform .2s,border-color .2s}
.sc:hover{transform:translateY(-2px);border-color:var(--wave)}
.sc q{display:block;font-family:var(--serif);font-style:italic;font-size:1.15rem;line-height:1.5;quotes:none;margin:.3rem 0}
.bq{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.6;border-left:3px solid var(--wave);padding:.4rem 0 .4rem 1rem;margin:.8rem 0;white-space:pre-wrap}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:#0E1E2E;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:1.2rem}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.8rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
.opt{display:block;width:100%;text-align:left;padding:.7rem .9rem;margin:.4rem 0;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.opt.good{border-color:var(--green);background:rgba(111,207,151,.16)}
.opt.bad{border-color:var(--coral);background:rgba(252,165,165,.14)}
#chatFab{position:fixed;right:14px;bottom:calc(var(--navh) + 14px);z-index:70;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7DD3FC,#2A9D8F);color:#06222b;font-size:1.5rem;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#chat{position:fixed;z-index:90;right:0;bottom:0;width:min(440px,100%);height:min(660px,90vh);background:#0E1E2E;border:1px solid var(--line);border-radius:20px 20px 0 0;display:none;flex-direction:column}
#chat.open{display:flex}
.chh{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.m{max-width:92%;padding:.6rem .85rem;font-size:.92rem;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:rgba(42,157,143,.3);border-radius:14px 14px 2px 14px}
.m.b{align-self:flex-start;background:rgba(255,255,255,.07);border-radius:14px 14px 14px 2px}
.spk{font-size:.85rem;opacity:.75;padding:.2rem .4rem}
.chin{display:flex;gap:.4rem;padding:.7rem;border-top:1px solid var(--line);align-items:center}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px);transform:translateX(-50%) translateY(20px);background:#0E2338;border:1px solid var(--wave);padding:.6rem 1rem;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90vw;font-size:.9rem;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.compass{width:130px;height:130px;border-radius:50%;border:2px solid var(--line);position:relative;margin:auto;background:radial-gradient(circle,rgba(125,211,252,.1),transparent 70%)}
.compass .ar{position:absolute;inset:20px;transition:transform .8s}
.compass .ar svg{width:100%;height:100%;fill:var(--sky)}
.compass i{position:absolute;font-style:normal;font-size:.65rem;color:var(--tx3);font-family:var(--mono)}
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:.6rem;margin:1rem 0;text-align:center}
.mt b{display:block;font-size:1.5rem;font-family:var(--serif)}
.mt small{color:var(--tx3);font-size:.72rem}
.adv{display:inline-block;padding:.35rem .9rem;border-radius:99px;font-weight:700;font-size:.85rem}
.adv.ok{background:rgba(111,207,151,.18);color:var(--green)}
.adv.caution{background:rgba(244,213,141,.18);color:var(--gold)}
.adv.danger{background:rgba(252,165,165,.2);color:var(--coral)}
.sos{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#B84040,#7f1d1d);border-radius:14px;padding:.9rem 1.1rem;font-weight:700;margin:1rem 0}
.strip{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0}
.cell{min-width:80px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem .3rem;font-size:.72rem;color:var(--tx2)}
.cell b{display:block;font-size:1.05rem;color:var(--tx)}
.tw{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:.85rem}
.rt td,.rt th{padding:.55rem .4rem;border-bottom:1px solid var(--line);text-align:start}
.rt th{font-family:var(--mono);font-size:.65rem;color:var(--tx3);text-transform:uppercase}
.rt tr[data-act]{cursor:pointer}
.rt tr[data-act]:hover{background:rgba(255,255,255,.04)}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--wave);border-radius:50%;margin:0 auto 1rem;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{margin-top:2rem;font-size:.72rem;color:var(--tx3);line-height:1.7}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:78px;font-size:.68rem;text-align:center;opacity:.35}
.badge.on{opacity:1}
.badge span{font-size:1.8rem}
@media print{body{background:#fff!important;padding:0!important}.top,#nav,#chatFab,#chat,.noprint,#toast,.ov{display:none!important}.page{display:none!important}#p-reports{display:block!important}main{padding:0!important;max-width:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="logo" data-act="go" data-p="home">Sagar<i>Katha</i></div>
  <span id="net" class="pill on">● online</span>
  <button class="ibtn" data-act="langsheet" aria-label="Language">🌐 <b id="langBtn">EN</b></button>
  <button class="ibtn" data-act="settings" aria-label="Settings">⚙️</button>
</header>

<nav id="nav" aria-label="Main">
  <button data-act="go" data-p="home"><span class="i">🏠</span><span data-i18n="nav_home"></span></button>
  <button data-act="go" data-p="map"><span class="i">🗺️</span><span data-i18n="nav_map"></span></button>
  <button data-act="go" data-p="ocean"><span class="i">🌊</span><span data-i18n="nav_ocean"></span></button>
  <button class="rec" data-act="go" data-p="record"><span class="i">🎙️</span><span data-i18n="nav_record"></span></button>
  <button data-act="go" data-p="tales"><span class="i">📖</span><span data-i18n="nav_tales"></span></button>
  <button data-act="go" data-p="community"><span class="i">👥</span><span data-i18n="nav_com"></span></button>
  <button data-act="go" data-p="reports"><span class="i">📊</span><span data-i18n="nav_rep"></span></button>
</nav>

<main>
  <section id="p-home" class="page"></section>

  <section id="p-map" class="page">
    <h2 class="pt"><span data-i18n="map_t"></span> <span class="pill on">● LIVE</span></h2>
    <input id="q" class="inp" type="search" maxlength="60" data-i18n-ph="search" style="margin:.6rem 0">
    <div class="chips" id="catChips"></div>
    <div class="chips" id="layerChips"></div>
    <div id="leaflet"></div>
    <div id="mapNote" class="meta" style="margin:.5rem 0"></div>
    <h3 class="sx" data-i18n="lib"></h3>
    <div id="lib" class="grid g2"></div>
  </section>

  <section id="p-record" class="page">
    <h2 class="pt" data-i18n="rec_t"></h2>
    <p class="sub" data-i18n="rec_sub"></p>
    <div id="recHint" class="meta"></div>
    <div class="card">
      <div style="text-align:center">
        <button id="mic" class="mic" data-act="mic" aria-label="Record voice">🎙️</button>
        <div><b id="micLbl" data-i18n="rec_voice"></b> <span id="recTime" class="meta"></span></div>
      </div>
      <label class="l" for="recText">✍️</label>
      <textarea id="recText" class="ta" maxlength="2000" data-i18n-ph="rec_ph"></textarea>
      <div class="row">
        <button id="dictBtn" class="btn g" data-act="dict">🗣️ <span data-i18n="rec_dict"></span></button>
        <label class="btn g" for="recFile">📷 <span data-i18n="rec_media"></span></label>
        <input type="file" id="recFile" accept="image/*,video/*" multiple hidden>
      </div>
      <div id="recPrev"></div>
      <label class="l" for="recRegion" data-i18n="rec_where"></label>
      <div class="row" style="margin-top:0">
        <select id="recRegion" class="sel" style="flex:1;min-width:200px"></select>
        <button class="btn g" data-act="gps">📍 <span data-i18n="rec_gps"></span></button>
      </div>
      <div id="gpsNote" class="meta"></div>
      <label class="l" data-i18n="rec_prec"></label>
      <div class="seg">
        <button data-act="seg" data-k="prec" data-v="exact" data-i18n="p_exact"></button>
        <button data-act="seg" data-k="prec" data-v="approx" class="on" data-i18n="p_approx"></button>
        <button data-act="seg" data-k="prec" data-v="region" data-i18n="p_region"></button>
      </div>
      <label class="l" data-i18n="rec_vis"></label>
      <div class="seg">
        <button data-act="seg" data-k="vis" data-v="public" class="on" data-i18n="v_public"></button>
        <button data-act="seg" data-k="vis" data-v="research" data-i18n="v_research"></button>
        <button data-act="seg" data-k="vis" data-v="private" data-i18n="v_private"></button>
      </div>
      <label class="l" for="recName" data-i18n="rec_name"></label>
      <input id="recName" class="inp" maxlength="40" autocomplete="off">
      <label style="display:flex;gap:.6rem;align-items:center;margin:.8rem 0;min-height:44px"><input type="checkbox" id="recAnon" style="width:22px;height:22px"> <span data-i18n="rec_anon"></span></label>
      <label style="display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0 1rem"><input type="checkbox" id="recCons" style="width:22px;height:22px;margin-top:.15rem"> <span data-i18n="rec_cons"></span></label>
      <button id="recSave" class="btn p" data-act="save" style="width:100%"><span data-i18n="rec_save"></span></button>
    </div>
  </section>

  <section id="p-ocean" class="page"></section>
  <section id="p-tales" class="page"></section>
  <section id="p-community" class="page"></section>
  <section id="p-reports" class="page"></section>
</main>

<button id="chatFab" data-act="chat" aria-label="Sagar Mitra">💬</button>
<div id="chat" role="dialog" aria-label="Sagar Mitra">
  <div class="chh"><b style="font-family:var(--serif);font-size:1.3rem">🌊 <span data-i18n="ch_t"></span></b><span><button class="ibtn" data-act="chclear" aria-label="Clear chat">🗑️</button> <button class="ibtn" data-act="chatclose" aria-label="Close">✕</button></span></div>
  <div class="msgs" id="chMsgs"></div>
  <div id="chPrev" style="padding:0 .7rem"></div>
  <div class="chin">
    <label class="ibtn" for="chFile" aria-label="Attach photo">📎</label><input type="file" id="chFile" accept="image/*" hidden>
    <input id="chIn" class="inp" maxlength="400" data-i18n-ph="ch_ph" style="flex:1;min-width:0">
    <button class="ibtn" data-act="chdict" aria-label="Speak">🎤</button>
    <button class="btn p" data-act="chsend" style="min-height:48px;padding:0 1rem" aria-label="Send">➤</button>
  </div>
</div>

<div id="ov" class="ov"><div class="sheet" id="sheet"></div></div>
<div id="busy" class="ov"><div class="sheet" style="text-align:center;max-width:320px;border-radius:20px"><div class="spin"></div><p id="busyMsg"></p></div></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(()=>{
'use strict';
/* Leaflet is captured as LF because L below is the language lookup helper. */
const LF=window.L;

/* ========== CONFIG — in production point AI_URL at your Supabase Edge Function (never ship an API key) ========== */
const CFG={AI_URL:'https://api.anthropic.com/v1/messages',MODEL:'claude-sonnet-4-6',MARINE:'https://marine-api.open-meteo.com/v1/marine',WX:'https://api.open-meteo.com/v1/forecast',TILES:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'};

/* ========== helpers ========== */

function shrinkTo(f,max,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);
im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);

/* ========== DATABASE (IndexedDB → artifact storage → memory). Collections: stories, media, posts, ocean_log, reports, meta ========== */
const COLS=['stories','media','posts','ocean_log','reports','meta'];
const DB={eng:'Memory',idb:null,mem:{},
async init(){
try{if(!window.indexedDB)throw 0;
this.idb=await Promise.race([new Promise((ok,no)=>{const q=indexedDB.open('sagarkatha',1);q.onupgradeneeded=()=>COLS.forEach(c=>q.result.createObjectStore(c,{keyPath:'id'}));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);q.onblocked=()=>no(new Error('blocked'));}),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),2500))]);
this.eng='IndexedDB';return;}catch(e){this.idb=null;}
if(window.storage){try{await window.storage.list('sk3:');this.eng='Storage';}catch(e){}}
},
_tx(c,m,fn){return new Promise((ok,no)=>{const tx=this.idb.transaction(c,m),r=fn(tx.objectStore(c));tx.oncomplete=()=>ok(r&&r.result);tx.onerror=tx.onabort=()=>no(tx.error);});},
async put(c,o){if(this.eng==='IndexedDB')return this._tx(c,'readwrite',s=>s.put(o));if(this.eng==='Storage'){try{await window.storage.set('sk3:'+c+':'+o.id,JSON.stringify(o));return;}catch(e){}}this.mem[c+':'+o.id]=o;},
async get(c,id){if(this.eng==='IndexedDB')return(await this._tx(c,'readonly',s=>s.get(id)))||null;if(this.eng==='Storage'){try{const r=await window.storage.get('sk3:'+c+':'+id);if(r&&r.value)return JSON.parse(r.value);}catch(e){}}return this.mem[c+':'+id]||null;},
async all(c){if(this.eng==='IndexedDB')return(await this._tx(c,'readonly',s=>s.getAll()))||[];
let out=[];if(this.eng==='Storage'){try{const l=await window.storage.list('sk3:'+c+':');out=(await Promise.all(((l&&l.keys)||[]).map(async k=>{try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}}))).filter(Boolean);}catch(e){}}
const ids=new Set(out.map(o=>o.id));Object.keys(this.mem).forEach(k=>{if(k.startsWith(c+':')&&!ids.has(this.mem[k].id))out.push(this.mem[k]);});return out;},
async del(c,id){if(this.eng==='IndexedDB')return this._tx(c,'readwrite',s=>s.delete(id));if(this.eng==='Storage'){try{await window.storage.delete('sk3:'+c+':'+id);}catch(e){}}delete this.mem[c+':'+id];},
async clear(c){if(this.eng==='IndexedDB')return this._tx(c,'readwrite',s=>s.clear());for(const o of await this.all(c))await this.del(c,o.id);}
};

try{

async function enhance(code){
if(code==='en'||code==='hi'||L(code).q==='fb'||S.noAI)return;
const l=L(code),keys=Object.keys(EXTRA),chunks=[];
for(let i=0;i<keys.length;i+=10)chunks.push(keys.slice(i,i+10));
const res=await Promise.allSettled(chunks.map(async ks=>{
const o={};ks.forEach(k=>o[k]=EXTRA[k]);
const out=await claude(`You translate app text for Indian fishing communities. Translate the JSON values from English into ${l.e} (${l.n})${l.sc?', written in '+l.sc:''}. Use simple everyday words. Keep the JSON keys unchanged. Keep emoji, numbers and acronyms (INCOIS, IMD, AI, CSV, PDF) unchanged. Reply with ONLY the JSON object.`,[{role:'user',content:JSON.stringify(o)}],20000);
return parseJSON(out);
}));
const ok=res.filter(r=>r.status==='fulfilled').map(r=>r.value);
if(!ok.length){S.noAI=true;return;}
const tr=Object.assign({},...ok);await DB.put('meta',{id:'i18x:'+code,tr});
if(S.prof.lang===code){TT=buildTT(code,tr);applyI18n();renderAll();}
}
async function setLang(code){
closeModal();
const c=code==='en'?null:await DB.get('meta','i18x:'+code),ai=c&&c.tr;
TT=buildTT(code,ai);S.prof.lang=code;await saveProf();applyI18n();renderAll();
if(code!=='en'&&!ai)enhance(code);
}

const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function micUI(on){$('#mic').classList.toggle('rec',on);$('#micLbl').textContent=on?'⏹ '+t('rec_stop'):t('rec_voice');if(!on)$('#recTime').textContent='';}
async function toggleMic(){
if(S.mr&&S.mr.state==='recording'){S.mr.stop();return;}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
const chunks=[],mr=new MediaRecorder(stream),t0=Date.now();S.mr=mr;
mr.ondataavailable=e=>chunks.push(e.data);
mr.onstop=()=>{stream.getTracks().forEach(x=>x.stop());clearInterval(S.tick);
const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});

S.draft.media.push({kind:'audio',blob,url:URL.createObjectURL(blob),name:'voice-note'});micUI(false);showPreview();};
mr.start();micUI(true);S.tick=setInterval(()=>{$('#recTime').textContent=fmtT(Date.now()-t0);},500);
setTimeout(()=>{if(mr.state==='recording')mr.stop();},120000);
}catch(e){toast(t('mic_err'));}
}

try{r.start();S.sr=r;btn.style.outline='2px solid #B84040';}catch(e){toast(t('mic_err'));}

async function onFile(e){

const ms=S.draft.media||(S.draft.media=[]);
for(const f of fs){
try{
if(f.type.startsWith('image/')){
if(f.size>15e6){toast('Image too large (max 15 MB)');continue;}

function ruleClassify(tx){
const s=' '+tx.toLowerCase()+' ';let best='change',bs=0;
for(const[c,ws]of Object.entries(KW)){const n=ws.reduce((a,w)=>a+(s.includes(w)?1:0),0);if(n>bs){bs=n;best=c;}}
const sp=KW.species.filter(w=>/^[a-z]/.test(w)&&s.includes(w)).slice(0,4).map(w=>w[0].toUpperCase()+w.slice(1));
return{cat:best,sp,tg:[],sm:tx?tx.slice(0,110)+(tx.length>110?'…':''):'Voice or photo story (transcription pending).',src:'rules'};
}
async function aiClassify(tx,rg){
const out=await claude('You sort short oral stories from Indian fishing communities. The story may be in any Indian language. Reply with ONLY JSON, no markdown: {"cat":"species|current|weather|change|technique|folklore","sp":["fish or sea-life names mentioned, in English"],"tg":["2-4 short lowercase tags in English"],"sm":"one-sentence English summary, max 22 words"}',[{role:'user',content:`Region: ${rg.name}, ${rg.state}.\nStory: """${tx.slice(0,1500)}"""`}],20000);
const j=parseJSON(out);
return{cat:CATS[j.cat]?j.cat:'change',sp:(j.sp||[]).slice(0,5).map(x=>String(x).slice(0,40)),tg:(j.tg||[]).slice(0,5).map(x=>String(x).slice(0,24)),sm:String(j.sm||'').slice(0,200),src:'ai'};
}
async function saveRec(){
const d=S.draft,tx=$('#recText').value.trim(),ms=d.media||[];
if(!$('#recCons').checked)return toast(t('need_cons'));
if(tx.length<10&&!ms.length)return toast(t('need_story'));

if(Date.now()-(S.last||0)<5000)return toast(t('wait'));
if(PII.test(tx))return toast(t('pii'));
S.last=Date.now();
const btn=$('#recSave');btn.disabled=true;btn.textContent='⏳ …';
const rg=REG(rgId||nearest(d.gps[0],d.gps[1]).id);
/* privacy: coordinates are blurred here, on the device, BEFORE anything is stored or uploaded */
let lat,lng,prec=d.prec||'approx';
if(!d.gps)prec='region';
if(prec==='exact'){[lat,lng]=d.gps;}
else if(prec==='approx'){lat=d.gps[0]+(Math.random()-.5)*.09;lng=d.gps[1]+(Math.random()-.5)*.09;}
else{lat=rg.lat+(Math.random()-.5)*.3;lng=rg.lng+(Math.random()-.5)*.3;}
let ai=ruleClassify(tx),status='queued';
if(navigator.onLine){status='synced';if(tx.length>=10&&!S.noAI){try{ai=await aiClassify(tx,rg);}catch(e){}}}
if(d.kind==='folklore')ai.cat='folklore';
const id=uid(),mids=[];let lost=0;
for(const m of ms){const mid=await addMedia(id,m.kind,m.data||m.blob,m.name);if(mid)mids.push(mid);else lost++;}
const rec={id,owner:S.prof.uid,name:$('#recAnon').checked?'':$('#recName').value.trim().slice(0,40),ts:Date.now(),rg:rg.id,lat,lng,prec,vis:d.vis||'public',lang:S.prof.lang,tx:tx.slice(0,2000),ai,mids,status};
await DB.put('stories',rec);S.recs.unshift(rec);award(20);
ms.forEach(m=>{if(m.url)URL.revokeObjectURL(m.url);});
S.newId=rec.id;resetDraft();
toast(t(status==='queued'?'queued':'saved')+(lost?' ('+lost+' large file kept off-device)':''));
go('map');
if(map)setTimeout(()=>map.flyTo([rec.lat,rec.lng],7,{duration:1.4}),250);
btn.disabled=false;btn.innerHTML='<span data-i18n="rec_save">'+h('rec_save')+'</span>';
}

$$('[data-k=prec],[data-k=vis]').forEach(b=>b.classList.toggle('on',b.dataset.v==='approx'||b.dataset.v==='public'));

function assess(d){
const rank={ok:0,c:1,d:2};let lv='ok';const why=[];
const up=(l,m)=>{if(rank[l]>rank[lv])lv=l;why.push(m);};
const w=d.wave??0,g=Math.max(d.gust??0,d.wind??0),c=d.code??0;
if(w>=4)up('d',`waves ${f1(w)} m`);else if(w>=2.5)up('c',`waves ${f1(w)} m`);
if(g>=60)up('d',`gusts ${Math.round(g)} km/h`);else if(g>=40)up('c',`gusts ${Math.round(g)} km/h`);
if(c>=95)up('d','thunderstorm');else if((c>=65&&c<=67)||c===82)up('c','heavy rain');
if(d.vis!=null&&d.vis<2000)up('c','low visibility');
return{lv,why};
}
const getJSON=async u=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(to);}};

getJSON(`${CFG.WX}?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation`)]);

S.ocean.data[r.id]={wave:c.wave_height,per:c.wave_period,wdir:c.wave_direction,swell:c.swell_wave_height,sper:c.swell_wave_period,sst:c.sea_surface_temperature,cur:c.ocean_current_velocity,cdir:c.ocean_current_direction,wind:d.wind_speed_10m,gust:d.wind_gusts_10m,wdr:d.wind_direction_10m,air:d.temperature_2m,code:d.weather_code,rain:d.precipitation};});

function simulate(){

function simRows(d){

function relevant(q){

function localBot(q,img){

if(/weather|wave|wind|sea |storm|cyclone|rain|safe|current|tide|मौसम|लहर|हवा|तूफान/.test(s)&&d){const A=assess(d);return`${r.name} now: waves ${f1(d.wave)} m, wind ${f1(d.wind)} km/h (gusts ${f1(d.gust)}), current ${f1(d.cur)} km/h. App caution level: ${A.lv==='ok'?'calm':A.lv==='c'?'be careful':'very rough'}${S.ocean.live?'':' (demo estimate, not real)'}. I am not an official forecaster: check INCOIS and IMD before going out. Emergency at sea: 1554. [[open:ocean]]`;}

if(/report|download|export|database|backup|data/.test(s))return"Open Reports to build a report from everything saved in the database, then print it, download it or back it up. [[open:reports]]";

const rel=relevant(q);if(rel.length)return'From the library: '+rel.map(x=>x.ai.sm).join(' ');

${chatCtx(txt)}`;

async function buildReportData(){
const o=S.rep,from=o.days?Date.now()-o.days*864e5:0;
const recs=allRecs().filter(r=>canSee(r)&&(o.sample||!r.sample)&&r.ts>=from&&(o.region==='all'||r.rg===o.region));
const cnt=(a,f)=>{const m={};a.forEach(x=>[].concat(f(x)).forEach(k=>{if(k)m[k]=(m[k]||0)+1;}));return Object.entries(m).sort((x,y)=>y[1]-x[1]);};
const d={ts:Date.now(),days:o.days,region:o.region,sample:o.sample,n:recs.length,recs,cats:cnt(recs,r=>r.ai.cat),regs:cnt(recs,r=>REG(r.rg).short),spp:cnt(recs,r=>r.ai.sp||[]).slice(0,8),langs:cnt(recs,r=>L(r.lang).e),photos:0,audio:0,video:0};
d.label=(o.days?`Last ${o.days} days`:'All time')+' · '+(o.region==='all'?'all coasts':REG(o.region).name);
recs.forEach(r=>mediaOf(r).forEach(m=>{if(m.kind==='image')d.photos++;else if(m.kind==='audio')d.audio++;else d.video++;}));
const first=recs.length?Math.min(...recs.map(r=>r.ts)):Date.now(),span=Math.max(1,Math.ceil((Date.now()-(from||first))/864e5));
d.step=span<=14?1:7;const nb=Math.min(12,Math.max(1,Math.ceil(span/d.step)));d.bins=Array(nb).fill(0);
recs.forEach(r=>{const i=nb-1-Math.min(nb-1,Math.floor((Date.now()-r.ts)/(d.step*864e5)));d.bins[Math.max(0,i)]++;});
d.posts=S.posts.filter(p=>(o.sample||!p.sample)&&p.ts>=from).length;
const logs=(await DB.all('ocean_log')).filter(l=>l.live&&l.ts>=from&&(o.region==='all'||l.rg===o.region)),by={};
logs.forEach(l=>{const b=by[l.rg]||(by[l.rg]={r:REG(l.rg).short,n:0,sw:0,maxW:0,maxG:0,sc:0});b.n++;b.sw+=l.wave||0;b.maxW=Math.max(b.maxW,l.wave||0);b.maxG=Math.max(b.maxG,l.gust||0);b.sc+=l.cur||0;});
d.ocean=Object.values(by).map(b=>({r:b.r,n:b.n,avgW:b.sw/b.n,maxW:b.maxW,maxG:b.maxG,avgC:b.sc/b.n}));
d.hl=[];
for(const r of recs.filter(x=>x.tx||x.ai.sm).slice(0,6)){const im=mediaOf(r).find(m=>m.kind==='image');let img=null;if(im)img=im.data||(im.blob?await toDataURL(im.blob):null);d.hl.push({rg:REG(r.rg).name,cat:catEn(r.ai.cat),sample:r.sample,tx:r.tx||r.ai.sm,sm:r.ai.sm,img});}
return d;
}

for(const c of['stories','posts','ocean_log'])out[c]=await DB.all(c);
out.media=[];
for(const m of await DB.all('media')){if(m.kind==='video')continue;const data=m.data||(m.blob&&m.blob.size<1.5e6?await toDataURL(m.blob):null);if(data)out.media.push({id:m.id,story:m.story,kind:m.kind,name:m.name,ts:m.ts,data});}
dl('sagarkatha-backup.json','application/json',JSON.stringify(out));
}
const cleanRec=o=>{
if(!o||typeof o.id!=='string'||!REGIONS.some(r=>r.id===o.rg))return null;const a=o.ai||{};
return{id:o.id.slice(0,40),owner:String(o.owner||S.prof.uid).slice(0,40),name:String(o.name||'').slice(0,40),ts:+o.ts||Date.now(),rg:o.rg,lat:+o.lat||REG(o.rg).lat,lng:+o.lng||REG(o.rg).lng,prec:['exact','approx','region'].includes(o.prec)?o.prec:'region',vis:['public','research','private'].includes(o.vis)?o.vis:'private',lang:LANGS.some(l=>l.c===o.lang)?o.lang:'en',tx:String(o.tx||'').slice(0,2000),ai:{cat:CATS[a.cat]?a.cat:'change',sp:(a.sp||[]).slice(0,5).map(x=>String(x).slice(0,40)),tg:(a.tg||[]).slice(0,5).map(x=>String(x).slice(0,24)),sm:String(a.sm||'').slice(0,200),src:'import'},mids:(o.mids||[]).slice(0,8).map(x=>String(x).slice(0,40)),status:'synced'};
};
async function restore(e){
const f=e.target.files[0];e.target.value='';if(!f||f.size>60e6)return;
try{
const j=JSON.parse(await f.text());if(j.app!=='sagarkatha')throw new Error('bad');let n=0;
for(const o of(j.stories||[]).slice(0,5000)){const r=cleanRec(o);if(r){await DB.put('stories',r);n++;}}
for(const o of(j.media||[]).slice(0,5000))if(o&&typeof o.id==='string'&&['image','audio'].includes(o.kind)&&/^data:(image|audio)\//.test(o.data||''))await DB.put('media',{id:o.id.slice(0,40),story:String(o.story||'').slice(0,40),kind:o.kind,name:String(o.name||'').slice(0,80),ts:+o.ts||Date.now(),data:o.data});
for(const o of(j.posts||[]).slice(0,2000))if(o&&typeof o.id==='string'&&typeof o.tx==='string')await DB.put('posts',{id:o.id.slice(0,40),owner:String(o.owner||'').slice(0,40),name:String(o.name||'').slice(0,40),type:'qsat'.includes(o.type)?o.type:'q',tx:o.tx.slice(0,500),ts:+o.ts||Date.now(),likes:+o.likes||0,replies:(o.replies||[]).slice(0,50).map(x=>({n:String(x.n||'').slice(0,40),tx:String(x.tx||'').slice(0,200)}))});
for(const o of(j.ocean_log||[]).slice(0,5000))if(o&&typeof o.id==='string'&&REGIONS.some(r=>r.id===o.rg))await DB.put('ocean_log',{id:o.id.slice(0,40),ts:+o.ts||Date.now(),rg:o.rg,live:!!o.live,manual:!!o.manual,wave:+o.wave||0,per:+o.per||0,cur:+o.cur||0,cdir:+o.cdir||0,sst:+o.sst||0,wind:+o.wind||0,gust:+o.gust||0,code:+o.code||0,lv:['ok','c','d'].includes(o.lv)?o.lv:'ok',why:[]});
await loadAll();toast(`Restored ${n} stories`);renderAll();
}catch(err){toast('That file is not a SagarKatha backup');}
}

/* ========== audio + content translation ========== */
function speak(txt,lang){
if(!('speechSynthesis' in window)){toast('Audio reading is not supported on this device');return;}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=L(lang).sr;u.rate=.92;speechSynthesis.speak(u);
}
async function myMemory(text,to,from){
const parts=text.match(/[^.!?।]+[.!?।]*\s*/g)||[text];let out='',buf='';
const flush=async()=>{if(!buf.trim())return;const r=await getJSON('https://api.mymemory.translated.net/get?q='+encodeURIComponent(buf.trim())+'&langpair='+encodeURIComponent(from+'|'+to));
const tt=r&&r.responseData&&r.responseData.translatedText;if(!tt||+r.responseStatus!==200)throw new Error('mm');out+=tt+' ';buf='';};
for(const p of parts){if((buf+p).length>450)await flush();buf+=p;}
await flush();return out.trim();
}
async function translateText(text,to,from){
const l=L(to);
if(!S.noAI){try{return(await claude(`Translate the user's text into ${l.e} (${l.n})${l.sc?', written in '+l.sc:''}. Keep the meaning and tone. Reply with the translation only.`,[{role:'user',content:text.slice(0,1800)}],15000)).trim();}catch(e){}}
return await myMemory(text,to,from||'en');
}
async function translateEl(src,dst,btn){
const to=S.prof.lang;if(to==='en'){openLangs();return;}
const s=$('#'+src),d=$('#'+dst);if(!s||!d)return;
const from=s.dataset.lang||'en';if(from===to){toast('Already in this language');return;}
btn.disabled=true;const old=btn.innerHTML;btn.textContent='⏳';
try{d.textContent=await translateText(s.textContent,to,from);d.dataset.lang=to;d.hidden=false;}catch(e){toast(t('tr_fail'));}
btn.disabled=false;btn.innerHTML=old;
}

/* ========== settings + language sheet ========== */
function openLangs(){
const badge=l=>l.q==='ok'?'':l.q==='draft'?'<span class="tag">draft</span>':`<span class="tag">→ ${esc(L(l.fb||'en').e)}</span>`;
modal(`<div class="sh"><b>🌐 ${h('lang')}</b><button class="ibtn" data-act="close" aria-label="Close">✕</button></div>
<p class="meta" style="margin-bottom:.6rem">22 scheduled languages + English. Menus, buttons and safety messages are built in and work offline. "draft" = needs a native-speaker review. "→ Hindi/Urdu" = shows that language until a native translation is added.</p>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem">${LANGS.map(l=>`<button class="opt ${l.c===S.prof.lang?'good':''}" data-act="lang" data-c="${l.c}" style="margin:0"><b>${esc(l.n)}</b><br><span class="meta">${esc(l.e)}</span> ${badge(l)}</button>`).join('')}</div>`);
}
function openSettings(){
modal(`<div class="sh"><b style="font-size:1.2rem">⚙️ Settings</b><button class="ibtn" data-act="close" aria-label="Close">✕</button></div>
<div class="row"><button class="chip ${S.prof.large?'on':''}" data-act="large">🔠 ${h('large')}</button><button class="chip ${S.prof.sample?'on':''}" data-act="sampleT">🧪 Sample stories</button></div>
<label class="l">Demo: preview the access rules as</label>
<div class="seg"><button class="${S.prof.viewer==='visitor'?'on':''}" data-act="viewer" data-v="visitor">Visitor</button><button class="${S.prof.viewer==='researcher'?'on':''}" data-act="viewer" data-v="researcher">Verified researcher</button></div>
<p class="meta" style="margin:.4rem 0">Stories marked "Researchers" only show up in researcher view. "Only me" stories never show to others.</p>
<div class="row"><button class="btn g" data-act="go" data-p="reports">📊 ${h('nav_rep')}</button><button class="btn g" data-act="wipe" id="wipeBtn">🗑️ Erase all my data</button></div>
<div class="card" style="margin-top:.8rem"><div class="meta">How your data is protected</div>
<ul style="margin:.5rem 0 0 1.1rem;font-size:.85rem;color:var(--tx2);line-height:1.8">
<li>The pin is blurred on your phone before saving.</li>
<li>Photos are re-encoded in the browser, which removes hidden GPS data.</li>
<li>You choose who sees each story. Names are never put in reports.</li>
<li>All text is escaped before display; phone numbers and emails are blocked; restored backups are validated.</li>
<li>Production adds login, Row-Level Security, private storage with signed links, rate limits and moderation.</li></ul></div>
<p class="foot">The built-in map shows a simplified coastline only. "Detailed map" loads third-party tiles, which may draw borders differently from India's official map. Check the official boundary rules before using detailed tiles in a public launch. Storage engine here: ${esc(DB.eng)}.</p>`);
}
async function wipe(el){
if(!arm(el,'wipe'))return;
for(const c of COLS)await DB.clear(c);
S.recs=[];S.posts=[];S.media={};S.chat=[];S.prof={...S.prof,name:'',points:0,read:[],quiz:[],liked:[],hidden:[],seeded:false};
await loadAll();closeModal();toast('Erased');renderAll();
}

/* ========== actions ========== */
function act(a,d,el){
switch(a){
case'go':closeModal();go(d.p);break;
case'lang':setLang(d.c);break;
case'langsheet':openLangs();break;
case'settings':openSettings();break;
case'close':closeModal();break;
case'rec':openRec(d.id);break;
case'tale':openTale(d.id);break;
case'zoom':el.style.maxWidth=el.style.maxWidth?'':'none';el.parentElement.style.display=el.style.maxWidth?'block':'';break;
case'showtale':{const x=TALES.find(y=>y.id===d.id);closeModal();go('map');if(map&&x)setTimeout(()=>map.flyTo([x.lat,x.lng],8,{duration:1.2}),250);break;}
case'sharetale':S.draft.kind='folklore';go('record');break;
case'cat':if(d.c==='all')S.filters.cats.clear();else S.filters.cats.has(d.c)?S.filters.cats.delete(d.c):S.filters.cats.add(d.c);renderMap();break;
case'layer':S.filters.layers[d.l]=!S.filters.layers[d.l];if(d.l==='tiles')setTiles(S.filters.layers.tiles);renderMap();break;
case'livesim':S.live.on?stopLive():startLive();renderChips();break;
case'ocsel':S.ocean.sel=d.id;go('ocean');break;
case'ocsel2':S.ocean.sel=d.id;renderOcean();loadDetail(d.id);break;
case'ocgps':if(!navigator.geolocation)return toast(t('gps_err'));navigator.geolocation.getCurrentPosition(p=>{S.ocean.sel=nearest(p.coords.latitude,p.coords.longitude).id;renderOcean();loadDetail(S.ocean.sel);},()=>toast(t('gps_err')),{timeout:8000});break;
case'ocrefresh':S.ocean.ts=0;S.ocean.data={};S.ocean.detail={};renderOcean();loadOcean(true).then(()=>{renderOcean();loadDetail(S.ocean.sel,true);});break;
case'ocsave':saveSnap(S.ocean.sel,true).then(o=>toast(o?'💾 '+REG(o.rg).short+' — '+t('saved').split('!')[0]:'—'));break;
case'ocask':{act('chat',{},el);sendChat(`Explain today's sea conditions for ${REG(S.ocean.sel).name} in simple words. What should fishers watch out for in the next 24 hours?`);break;}
case'quiz':answerQuiz(d.t,+d.i,el);break;
case'speak':{const dst=$('#'+d.dst),s=$('#'+d.src),use=(dst&&!dst.hidden&&dst.textContent)?dst:s;if(use)speak(use.textContent,use.dataset.lang||'en');break;}
case'speakmsg':{const m=S.chat[+d.i];if(m)speak(m.content,S.prof.lang);break;}
case'tr':translateEl(d.src,d.dst,el);break;
case'seg':S.draft[d.k]=d.v;$$(`[data-act=seg][data-k=${d.k}]`).forEach(b=>b.classList.toggle('on',b===el));break;
case'mic':toggleMic();break;
case'dict':dictate($('#recText'),el);break;
case'chdict':dictate($('#chIn'),el);break;
case'gps':useGPS();break;
case'save':saveRec();break;
case'rm':{const m=(S.draft.media||[])[+d.i];if(m&&m.url)URL.revokeObjectURL(m.url);(S.draft.media||[]).splice(+d.i,1);showPreview();break;}
case'delrec':if(arm(el,'del'+d.id))delRec(d.id);break;
case'ptype':S.ptype=d.v;$$('[data-act=ptype]').forEach(b=>b.classList.toggle('on',b===el));break;
case'post':addPost();break;
case'reply':addReply(d.id);break;
case'like':{const i=S.prof.liked.indexOf(d.id);i<0?S.prof.liked.push(d.id):S.prof.liked.splice(i,1);saveProf();renderCom();break;}
case'report':S.prof.hidden.push(d.id);saveProf();toast(t('reported'));renderCom();break;
case'chat':$('#chat').classList.add('open');$('#chatFab').style.display='none';if(!S.ocean.ts)loadOcean();loadDetail(S.ocean.sel);renderChat();break;
case'chatclose':$('#chat').classList.remove('open');$('#chatFab').style.display='';break;
case'chsend':sendChat();break;
case'cs':sendChat(el.textContent);break;
case'chrmimg':S.chatImg=null;renderChat();break;
case'chclear':S.chat=[];S.chatImg=null;DB.put('meta',{id:'chat',msgs:[]});renderChat();break;
case'large':S.prof.large=!S.prof.large;saveProf();applyI18n();el.classList.toggle('on',S.prof.large);break;
case'sampleT':S.prof.sample=!S.prof.sample;saveProf();el.classList.toggle('on',S.prof.sample);renderAll();break;
case'viewer':S.prof.viewer=d.v;saveProf();$$('[data-act=viewer]').forEach(b=>b.classList.toggle('on',b===el));renderAll();break;
case'wipe':wipe(el);break;
case'rp':S.rep.days=+d.v;showReports();break;
case'rrg':S.rep.region=d.id;showReports();break;
case'rsample':S.rep.sample=!S.rep.sample;showReports();break;
case'repmake':makeReport(false);break;
case'repai':makeReport(true);break;
case'repprint':{if(!S.rep.html){toast(t('rep_empty'));break;}try{window.print();}catch(e){toast('Use "Download report", then print it from your browser');}break;}
case'rephtml':{if(!S.rep.html){toast(t('rep_empty'));break;}dl('sagarkatha-report.html','text/html',`<!doctype html><html><head><meta charset="utf-8"><title>SagarKatha report</title><style>body{margin:0;background:#e9eef2;padding:16px}${PAPER_CSS}</style></head><body>${S.rep.html}</body></html>`);break;}
case'repcsv':exportCSV();break;
case'repjson':backup();break;
case'repopen':DB.get('reports',d.id).then(x=>{if(x){S.rep.html=x.html;showReports();}});break;
case'repdel':DB.del('reports',d.id).then(()=>{S.rep.html='';showReports();});break;
}
}

/* ========== init ========== */
async function loadAll(){
const p=await DB.get('meta','profile');if(p){const{id,...rest}=p;Object.assign(S.prof,rest);}
S.prof.uid=S.prof.uid||uid();
S.recs=(await DB.all('stories')).sort((a,b)=>b.ts-a.ts);
S.posts=await DB.all('posts');
S.media={};(await DB.all('media')).forEach(m=>{S.media[m.id]=m;});
const c=await DB.get('meta','chat');S.chat=(c&&c.msgs)||[];
if(!S.prof.seeded){for(const x of SEEDPOSTS){const q={...x,ts:Date.now()+x.ts};await DB.put('posts',q);S.posts.push(q);}S.prof.seeded=true;}
await saveProf();
}
async function migrate(){
if(!window.storage||await DB.get('meta','mig'))return;
try{
const g=async k=>{try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}};
const p=await g('sk:prof');if(p&&!(await DB.get('meta','profile'))){const{id,...rest}=p;await DB.put('meta',{...rest,uid:id,id:'profile'});}
for(const o of(await g('sk:recs'))||[])if(o&&o.id){const mids=[];for(const m of o.media||[])if(m&&m.u){const x=await addMedia(o.id,'image',m.u,'');if(x)mids.push(x);}const{media,audioUrl,vidUrl,...rest}=o;await DB.put('stories',{...rest,mids});}
for(const o of(await g('sk:posts'))||[])if(o&&o.id)await DB.put('posts',o);
}catch(e){}
await DB.put('meta',{id:'mig'});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset,b);});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
$('#q').addEventListener('input',e=>{clearTimeout(S.qt);S.qt=setTimeout(()=>{S.filters.q=e.target.value.trim().toLowerCase();renderMap();},200);});
$('#recFile').addEventListener('change',onFile);
$('#chFile').addEventListener('change',onChatFile);
document.addEventListener('change',e=>{if(e.target.id==='repFile')restore(e);});
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
window.addEventListener('online',()=>{netUI();syncQueue();});window.addEventListener('offline',netUI);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('error',e=>{if(e&&e.message&&!/ResizeObserver/.test(e.message))toast('⚠️ '+String(e.message).slice(0,90));});

(async function init(){
TT=buildTT('en');
await DB.init();await migrate();await loadAll();
const c=S.prof.lang==='en'?null:await DB.get('meta','i18x:'+S.prof.lang),ai=c&&c.tr;
TT=buildTT(S.prof.lang,ai);
applyI18n();netUI();prepRecord();go('home');
loadOcean().then(()=>{if(S.page==='home')renderHome();});
if(S.prof.lang!=='en'&&!ai)enhance(S.prof.lang);
if(navigator.onLine)syncQueue();
})();
})();
